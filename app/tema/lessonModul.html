<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blok Tabanlı Ortamda Yazılım Geliştirme</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #222636;
    --border: #2e3348;
    --text: #e8eaf0;
    --text-muted: #8b90a7;
    --accent1: #6c63ff;
    --accent2: #ff6584;
    --accent3: #43e97b;
    --accent4: #f7971e;
    --accent5: #4facfe;
    --radius: 14px;
    --radius-sm: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ---- HEADER ---- */
  .header {
    background: linear-gradient(135deg, #1a1d27 0%, #12151f 100%);
    border-bottom: 1px solid var(--border);
    padding: 0 2rem;
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    gap: 1.5rem;
    height: 64px;
  }
  .header-badge {
    background: var(--accent1);
    color: white;
    font-size: 0.65rem;
    font-weight: 800;
    letter-spacing: 1px;
    padding: 4px 10px;
    border-radius: 20px;
    text-transform: uppercase;
    flex-shrink: 0;
  }
  .header-title {
    font-size: 1rem;
    font-weight: 800;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .header-meta {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 1rem;
    flex-shrink: 0;
  }
  .header-meta span {
    font-size: 0.78rem;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .progress-mini {
    width: 120px;
    height: 6px;
    background: var(--border);
    border-radius: 99px;
    overflow: hidden;
  }
  .progress-mini-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent1), var(--accent3));
    border-radius: 99px;
    transition: width 0.5s ease;
    width: 0%;
  }

  /* ---- LAYOUT ---- */
  .layout {
    display: grid;
    grid-template-columns: 260px 1fr;
    min-height: calc(100vh - 64px);
  }

  /* ---- SIDEBAR ---- */
  .sidebar {
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 1.5rem 0;
    position: sticky;
    top: 64px;
    height: calc(100vh - 64px);
    overflow-y: auto;
  }
  .sidebar-label {
    font-size: 0.68rem;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-muted);
    padding: 0 1.25rem;
    margin-bottom: 0.75rem;
  }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.75rem 1.25rem;
    cursor: pointer;
    border-left: 3px solid transparent;
    transition: all 0.2s;
    color: var(--text-muted);
    font-size: 0.85rem;
    font-weight: 600;
    user-select: none;
  }
  .nav-item:hover { background: var(--surface2); color: var(--text); }
  .nav-item.active {
    border-left-color: var(--accent1);
    background: rgba(108,99,255,0.1);
    color: var(--text);
  }
  .nav-item.done { color: var(--accent3); }
  .nav-item.done .nav-icon { background: rgba(67,233,123,0.15); }
  .nav-icon {
    width: 32px;
    height: 32px;
    border-radius: var(--radius-sm);
    background: var(--surface2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    flex-shrink: 0;
  }
  .nav-check {
    margin-left: auto;
    font-size: 0.9rem;
    color: var(--accent3);
  }
  .sidebar-divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 1rem 1.25rem;
  }

  /* ---- MAIN ---- */
  .main {
    padding: 2rem 2.5rem;
    max-width: 860px;
  }

  /* ---- SECTION HEADER ---- */
  .section-header {
    display: flex;
    align-items: flex-start;
    gap: 1rem;
    margin-bottom: 2rem;
    animation: fadeUp 0.4s ease;
  }
  .section-icon-big {
    width: 56px;
    height: 56px;
    border-radius: 16px;
    background: var(--surface2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.8rem;
    flex-shrink: 0;
    border: 1px solid var(--border);
  }
  .section-title-block h1 {
    font-size: 1.5rem;
    font-weight: 900;
    line-height: 1.2;
  }
  .section-title-block p {
    font-size: 0.8rem;
    color: var(--text-muted);
    margin-top: 4px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  /* ---- CONTENT BLOCKS ---- */
  .content-block {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.75rem;
    margin-bottom: 1.25rem;
    animation: fadeUp 0.4s ease;
  }
  .content-block h2 {
    font-size: 1.2rem;
    font-weight: 800;
    margin-bottom: 1rem;
    color: var(--text);
  }
  .content-block h3 {
    font-size: 1rem;
    font-weight: 800;
    margin: 1.25rem 0 0.5rem;
    color: var(--accent5);
  }
  .content-block p, .content-block li {
    font-size: 0.92rem;
    color: #c8cad8;
    line-height: 1.75;
  }
  .content-block ul, .content-block ol {
    padding-left: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
  }
  .content-block strong { color: var(--text); font-weight: 800; }

  /* table */
  .content-block table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 0.75rem;
    font-size: 0.87rem;
  }
  .content-block th {
    background: var(--surface2);
    padding: 0.6rem 1rem;
    text-align: left;
    font-weight: 800;
    color: var(--accent5);
    border-bottom: 1px solid var(--border);
  }
  .content-block td {
    padding: 0.6rem 1rem;
    border-bottom: 1px solid var(--border);
    color: #c8cad8;
  }
  .content-block tr:last-child td { border-bottom: none; }

  /* SVG image block */
  .svg-block {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.25rem;
    margin-bottom: 1.25rem;
    animation: fadeUp 0.4s ease;
  }
  .svg-block svg { width: 100%; height: auto; display: block; }
  .svg-caption {
    text-align: center;
    font-size: 0.78rem;
    color: var(--text-muted);
    margin-top: 0.75rem;
    font-style: italic;
  }

  /* Misconception block */
  .misconception {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.5rem;
    margin-bottom: 1.25rem;
    animation: fadeUp 0.4s ease;
  }
  .misconception-title {
    font-size: 0.68rem;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent2);
    margin-bottom: 1rem;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .misc-wrong {
    background: rgba(255,101,132,0.08);
    border: 1px solid rgba(255,101,132,0.25);
    border-radius: var(--radius-sm);
    padding: 0.9rem 1rem;
    margin-bottom: 0.75rem;
    font-size: 0.88rem;
    color: #e8a0ad;
    display: flex;
    gap: 0.6rem;
  }
  .misc-correct {
    background: rgba(67,233,123,0.07);
    border: 1px solid rgba(67,233,123,0.2);
    border-radius: var(--radius-sm);
    padding: 0.9rem 1rem;
    margin-bottom: 0.75rem;
    font-size: 0.88rem;
    color: #96e6b0;
    display: flex;
    gap: 0.6rem;
  }
  .misc-tip {
    background: rgba(247,151,30,0.08);
    border: 1px solid rgba(247,151,30,0.2);
    border-radius: var(--radius-sm);
    padding: 0.9rem 1rem;
    font-size: 0.85rem;
    color: #f7c97e;
    display: flex;
    gap: 0.6rem;
  }
  .misc-icon { flex-shrink: 0; font-size: 1.1rem; }

  /* ---- QUIZ ---- */
  .quiz-section {
    margin-top: 2rem;
    border-top: 1px solid var(--border);
    padding-top: 2rem;
  }
  .quiz-section-label {
    font-size: 0.68rem;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent4);
    margin-bottom: 1.25rem;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .quiz-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.5rem;
    margin-bottom: 1rem;
    animation: fadeUp 0.4s ease;
  }
  .quiz-q-num {
    font-size: 0.7rem;
    font-weight: 800;
    color: var(--accent1);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 0.5rem;
    font-family: 'Space Mono', monospace;
  }
  .quiz-q-text {
    font-size: 0.95rem;
    font-weight: 700;
    margin-bottom: 1rem;
    line-height: 1.5;
  }
  .quiz-q-statement {
    background: var(--surface2);
    border-radius: var(--radius-sm);
    padding: 0.75rem 1rem;
    font-size: 0.9rem;
    margin-bottom: 1rem;
    color: var(--accent5);
    font-style: italic;
  }

  /* Single / Multiple choice options */
  .options-list { display: flex; flex-direction: column; gap: 0.5rem; }
  .option-btn {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.75rem 1rem;
    border-radius: var(--radius-sm);
    border: 1.5px solid var(--border);
    background: var(--surface2);
    cursor: pointer;
    transition: all 0.18s;
    text-align: left;
    font-family: 'Nunito', sans-serif;
    font-size: 0.88rem;
    color: var(--text);
    font-weight: 600;
    width: 100%;
  }
  .option-btn:hover:not(:disabled) { border-color: var(--accent1); background: rgba(108,99,255,0.08); }
  .option-btn.selected { border-color: var(--accent1); background: rgba(108,99,255,0.15); }
  .option-btn.correct { border-color: var(--accent3); background: rgba(67,233,123,0.1); color: var(--accent3); }
  .option-btn.wrong { border-color: var(--accent2); background: rgba(255,101,132,0.1); color: var(--accent2); }
  .option-letter {
    width: 26px; height: 26px;
    border-radius: 6px;
    background: var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.75rem;
    font-weight: 800;
    flex-shrink: 0;
    font-family: 'Space Mono', monospace;
    transition: background 0.18s;
  }
  .option-btn.correct .option-letter { background: var(--accent3); color: #0f1117; }
  .option-btn.wrong .option-letter { background: var(--accent2); color: white; }
  .option-btn.selected .option-letter { background: var(--accent1); color: white; }

  /* True/False */
  .tf-row { display: flex; gap: 0.75rem; }
  .tf-btn {
    flex: 1;
    padding: 0.75rem;
    border-radius: var(--radius-sm);
    border: 1.5px solid var(--border);
    background: var(--surface2);
    cursor: pointer;
    font-family: 'Nunito', sans-serif;
    font-size: 0.9rem;
    font-weight: 800;
    color: var(--text);
    text-align: center;
    transition: all 0.18s;
  }
  .tf-btn:hover:not(:disabled) { border-color: var(--accent1); background: rgba(108,99,255,0.1); }
  .tf-btn.correct { border-color: var(--accent3); background: rgba(67,233,123,0.1); color: var(--accent3); }
  .tf-btn.wrong { border-color: var(--accent2); background: rgba(255,101,132,0.1); color: var(--accent2); }
  .tf-btn.selected { border-color: var(--accent1); background: rgba(108,99,255,0.12); }

  /* Ordering */
  .ordering-list { display: flex; flex-direction: column; gap: 0.5rem; }
  .order-item {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.7rem 1rem;
    border-radius: var(--radius-sm);
    border: 1.5px solid var(--border);
    background: var(--surface2);
    cursor: grab;
    font-size: 0.88rem;
    font-weight: 600;
    transition: all 0.18s;
    user-select: none;
  }
  .order-item:active { cursor: grabbing; opacity: 0.7; transform: scale(0.98); }
  .order-item.dragging { opacity: 0.4; }
  .order-item.over { border-color: var(--accent1); background: rgba(108,99,255,0.1); }
  .order-item.correct-order { border-color: var(--accent3); background: rgba(67,233,123,0.07); }
  .order-item.wrong-order { border-color: var(--accent2); background: rgba(255,101,132,0.07); }
  .order-num {
    width: 26px; height: 26px;
    border-radius: 6px;
    background: var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.75rem;
    font-weight: 800;
    flex-shrink: 0;
    font-family: 'Space Mono', monospace;
  }
  .drag-handle { color: var(--text-muted); font-size: 0.8rem; margin-left: auto; }

  /* Matching */
  .matching-grid { display: grid; gap: 0.75rem; }
  .match-row { display: flex; gap: 0.75rem; align-items: center; }
  .match-left, .match-right {
    flex: 1;
    padding: 0.65rem 0.9rem;
    border-radius: var(--radius-sm);
    border: 1.5px solid var(--border);
    background: var(--surface2);
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.18s;
    text-align: center;
  }
  .match-left { background: rgba(108,99,255,0.05); border-color: rgba(108,99,255,0.3); color: #a5a0ff; }
  .match-right:hover { border-color: var(--accent1); background: rgba(108,99,255,0.1); }
  .match-right.selected { border-color: var(--accent1); background: rgba(108,99,255,0.15); }
  .match-right.correct { border-color: var(--accent3); background: rgba(67,233,123,0.1); color: var(--accent3); }
  .match-right.wrong { border-color: var(--accent2); background: rgba(255,101,132,0.1); color: var(--accent2); }
  .match-arrow { color: var(--text-muted); font-size: 1rem; flex-shrink: 0; }

  /* Fill blank */
  .fill-blank-row { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.75rem; }
  .blank-word-btn {
    padding: 0.45rem 0.9rem;
    border-radius: 6px;
    border: 1.5px solid var(--border);
    background: var(--surface2);
    font-family: 'Nunito', sans-serif;
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--text);
    cursor: pointer;
    transition: all 0.18s;
  }
  .blank-word-btn:hover:not(:disabled) { border-color: var(--accent1); background: rgba(108,99,255,0.1); }
  .blank-word-btn.used { opacity: 0.3; cursor: default; }
  .blank-word-btn.correct { border-color: var(--accent3); background: rgba(67,233,123,0.1); color: var(--accent3); }
  .blank-word-btn.wrong { border-color: var(--accent2); background: rgba(255,101,132,0.1); color: var(--accent2); }

  .fill-blank-text {
    font-size: 0.92rem;
    font-weight: 600;
    line-height: 2;
    margin-bottom: 0.75rem;
    color: var(--text);
  }
  .fill-blank-slot {
    display: inline-block;
    border-bottom: 2px solid var(--accent1);
    min-width: 100px;
    padding: 0 8px;
    font-weight: 800;
    color: var(--accent1);
    text-align: center;
  }

  /* Classical order (drag words) */
  .word-bank { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 0.75rem; }
  .word-chip {
    padding: 0.4rem 0.85rem;
    border-radius: 6px;
    border: 1.5px solid var(--border);
    background: var(--surface2);
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.18s;
    color: var(--text);
  }
  .word-chip:hover:not(.used):not(:disabled) { border-color: var(--accent1); background: rgba(108,99,255,0.1); }
  .word-chip.used { opacity: 0.3; cursor: default; }
  .answer-slots {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    min-height: 44px;
    padding: 0.5rem;
    border-radius: var(--radius-sm);
    border: 1.5px dashed var(--border);
    background: rgba(255,255,255,0.02);
    margin-bottom: 0.75rem;
    align-items: center;
  }
  .answer-chip {
    padding: 0.4rem 0.85rem;
    border-radius: 6px;
    background: rgba(108,99,255,0.2);
    border: 1.5px solid var(--accent1);
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--accent1);
    cursor: pointer;
    transition: all 0.18s;
  }
  .answer-chip:hover { opacity: 0.7; }
  .answer-chip.correct { background: rgba(67,233,123,0.15); border-color: var(--accent3); color: var(--accent3); }
  .answer-chip.wrong { background: rgba(255,101,132,0.12); border-color: var(--accent2); color: var(--accent2); }

  /* Quiz actions */
  .quiz-actions { display: flex; gap: 0.75rem; margin-top: 1rem; align-items: center; flex-wrap: wrap; }
  .btn-check {
    padding: 0.6rem 1.4rem;
    border-radius: 8px;
    border: none;
    background: var(--accent1);
    color: white;
    font-family: 'Nunito', sans-serif;
    font-size: 0.88rem;
    font-weight: 800;
    cursor: pointer;
    transition: all 0.18s;
  }
  .btn-check:hover { opacity: 0.85; transform: translateY(-1px); }
  .btn-check:disabled { opacity: 0.4; cursor: default; transform: none; }
  .btn-hint {
    padding: 0.6rem 1.1rem;
    border-radius: 8px;
    border: 1.5px solid var(--border);
    background: transparent;
    color: var(--text-muted);
    font-family: 'Nunito', sans-serif;
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.18s;
  }
  .btn-hint:hover { border-color: var(--accent4); color: var(--accent4); }
  .btn-reset {
    padding: 0.6rem 1.1rem;
    border-radius: 8px;
    border: 1.5px solid var(--border);
    background: transparent;
    color: var(--text-muted);
    font-family: 'Nunito', sans-serif;
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.18s;
    margin-left: auto;
  }
  .btn-reset:hover { border-color: var(--text-muted); color: var(--text); }

  /* Feedback */
  .quiz-feedback {
    margin-top: 0.75rem;
    padding: 0.9rem 1rem;
    border-radius: var(--radius-sm);
    font-size: 0.87rem;
    font-weight: 600;
    line-height: 1.6;
    display: none;
  }
  .quiz-feedback.correct {
    display: block;
    background: rgba(67,233,123,0.08);
    border: 1px solid rgba(67,233,123,0.25);
    color: #96e6b0;
  }
  .quiz-feedback.wrong {
    display: block;
    background: rgba(255,101,132,0.08);
    border: 1px solid rgba(255,101,132,0.25);
    color: #e8a0ad;
  }
  .quiz-feedback.hint {
    display: block;
    background: rgba(247,151,30,0.08);
    border: 1px solid rgba(247,151,30,0.2);
    color: #f7c97e;
  }

  /* ---- SECTION NAV ---- */
  .section-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 2.5rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--border);
  }
  .btn-nav {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.75rem 1.5rem;
    border-radius: 10px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-family: 'Nunito', sans-serif;
    font-size: 0.9rem;
    font-weight: 800;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-nav:hover { border-color: var(--accent1); color: var(--accent1); transform: translateY(-1px); }
  .btn-nav-primary {
    background: var(--accent1);
    border-color: var(--accent1);
    color: white;
  }
  .btn-nav-primary:hover { background: #7c75ff; border-color: #7c75ff; color: white; }
  .btn-nav:disabled { opacity: 0.3; cursor: default; transform: none; }

  /* Score badge */
  .score-badge {
    font-family: 'Space Mono', monospace;
    font-size: 0.85rem;
    color: var(--text-muted);
  }

  /* ---- ANIMATIONS ---- */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes pulse {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }
  .celebrate { animation: pulse 0.5s ease 2; }

  /* ---- REVIEW SECTION ---- */
  .review-banner {
    background: linear-gradient(135deg, rgba(108,99,255,0.15), rgba(67,233,123,0.1));
    border: 1px solid rgba(108,99,255,0.3);
    border-radius: var(--radius);

// =============================================
// STATE
// =============================================
let currentSection = 0;
const quizState = {}; // id -> { answered, correct }
const completedSections = new Set();

// =============================================
// NAV RENDER
// =============================================
function renderNav() {
  const nav = document.getElementById('navItems');
  nav.innerHTML = data.sections.map((s, i) => `
    <div class="nav-item ${i === currentSection ? 'active' : ''} ${completedSections.has(i) ? 'done' : ''}"
         onclick="goToSection(${i})">
      <div class="nav-icon">${s.icon}</div>
      <div style="flex:1;line-height:1.3">${s.title}</div>
      ${completedSections.has(i) ? '<div class="nav-check">✓</div>' : ''}
    </div>
  `).join('<hr class="sidebar-divider">');

  // progress
  const done = completedSections.size;
  const total = data.sections.length;
  document.getElementById('progressFill').style.width = (done/total*100)+'%';
  document.getElementById('progressText').textContent = done+'/'+total;
}

// =============================================
// SECTION RENDER
// =============================================
function renderSection(idx) {
  const s = data.sections[idx];
  const main = document.getElementById('mainContent');

  let html = `
    <div class="section-header">
      <div class="section-icon-big">${s.icon}</div>
      <div class="section-title-block">
        <p>Bölüm ${s.order} / ${data.sections.length}</p>
        <h1>${s.title}</h1>
      </div>
    </div>
  `;

  // content blocks
  s.content.forEach(block => {
    if (block.type === 'markdown') {
      html += `<div class="content-block">${block.body}</div>`;
    } else if (block.type === 'svg') {
      html += `<div class="svg-block">${block.svg}<div class="svg-caption">${block.caption}</div></div>`;
    } else if (block.type === 'misconception') {
      html += `
        <div class="misconception">
          <div class="misconception-title">⚠️ Yaygın Yanlış Anlama</div>
          <div class="misc-wrong"><span class="misc-icon">✗</span><div>${block.wrong}</div></div>
          <div class="misc-correct"><span class="misc-icon">✓</span><div>${block.correct}</div></div>
          <div class="misc-tip"><span class="misc-icon">💡</span><div>${block.tip}</div></div>
        </div>`;
    }
  });

  // quiz
  if (s.quiz && s.quiz.length > 0) {
    html += `<div class="quiz-section"><div class="quiz-section-label">🎯 Bölüm Soruları</div>`;
    s.quiz.forEach((q, qi) => {
      html += renderQuiz(q, qi);
    });
    html += `</div>`;
  }

  // nav buttons
  html += `
    <div class="section-nav">
      <button class="btn-nav" onclick="goToSection(${idx-1})" ${idx===0?'disabled':''}>← Önceki</button>
      <span class="score-badge" id="sectionScore_${idx}"></span>
      <button class="btn-nav btn-nav-primary" onclick="nextSection(${idx})">
        ${idx === data.sections.length-1 ? '🎉 Tamamla' : 'Sonraki →'}
      </button>
    </div>`;

  main.innerHTML = html;
  main.scrollTop = 0;
  window.scrollTo(0,0);

  // restore state
  s.quiz?.forEach(q => {
    if (quizState[q.id]) restoreQuizUI(q, quizState[q.id]);
  });

  updateSectionScore(idx);
  initDragDrop();
}

// =============================================
// QUIZ RENDER
// =============================================
function renderQuiz(q, qi) {
  const letters = ['A','B','C','D','E'];
  let body = '';

  if (q.type === 'single_choice') {
    body = `<div class="options-list">${q.options.map((o,i)=>`
      <button class="option-btn" id="opt_${q.id}_${i}" onclick="selectSingle('${q.id}',${i})">
        <span class="option-letter">${letters[i]}</span>${o}
      </button>`).join('')}</div>`;
  } else if (q.type === 'multiple_choice') {
    body = `<div class="options-list">${q.options.map((o,i)=>`
      <button class="option-btn" id="opt_${q.id}_${i}" onclick="toggleMulti('${q.id}',${i})">
        <span class="option-letter">${letters[i]}</span>${o}
      </button>`).join('')}</div>`;
  } else if (q.type === 'true_false') {
    body = `
      <div class="quiz-q-statement">${q.statement}</div>
      <div class="tf-row">
        <button class="tf-btn" id="tf_${q.id}_true" onclick="selectTF('${q.id}',true)">✓ Doğru</button>
        <button class="tf-btn" id="tf_${q.id}_false" onclick="selectTF('${q.id}',false)">✗ Yanlış</button>
      </div>`;
  } else if (q.type === 'ordering') {
    body = `<div class="ordering-list" id="order_${q.id}">
      ${q.items.map((item,i)=>`
        <div class="order-item" data-id="${q.id}" data-idx="${i}" draggable="true">
          <span class="order-num">${i+1}</span>
          <span>${item}</span>
          <span class="drag-handle">⠿</span>
        </div>`).join('')}
    </div>`;
  } else if (q.type === 'matching') {
    // shuffle rights
    const shuffled = [...q.pairs].sort(()=>Math.random()-0.5);
    body = `<div class="matching-grid">
      ${q.pairs.map((p,i)=>`
        <div class="match-row">
          <div class="match-left">${p.left}</div>
          <div class="match-arrow">→</div>
          <select class="match-right" id="match_${q.id}_${i}" style="flex:1;padding:0.65rem 0.9rem;border-radius:8px;border:1.5px solid var(--border);background:var(--surface2);color:var(--text);font-family:'Nunito',sans-serif;font-size:0.85rem;font-weight:700;cursor:pointer">
            <option value="">— Seç —</option>
            ${shuffled.map(s=>`<option value="${s.right}">${s.right}</option>`).join('')}
          </select>
        </div>`).join('')}
    </div>`;
  } else if (q.type === 'fill_blank') {
    const allWords = [...q.accepted, ...q.distractors].sort(()=>Math.random()-0.5);
    const displayText = q.question_text.replace('________', `<span class="fill-blank-slot" id="slot_${q.id}">________</span>`);
    body = `
      <div class="fill-blank-text">${displayText}</div>
      <div class="fill-blank-row">${allWords.map(w=>`
        <button class="blank-word-btn" id="word_${q.id}_${w}" onclick="selectFill('${q.id}','${w}')">${w}</button>`).join('')}
      </div>`;
  } else if (q.type === 'classical_order') {
    const shuffled = [...q.words].sort(()=>Math.random()-0.5);
    body = `
      <div class="answer-slots" id="slots_${q.id}"></div>
      <div class="word-bank" id="bank_${q.id}">${shuffled.map(w=>`
        <button class="word-chip" id="chip_${q.id}_${w.replace(/\s/g,'_')}" onclick="selectWord('${q.id}','${w}')">${w}</button>`).join('')}
      </div>`;
  }

  return `
    <div class="quiz-card" id="qcard_${q.id}">
      <div class="quiz-q-num">Soru ${qi+1}</div>
      <div class="quiz-q-text">${q.question}</div>
      ${body}
      <div class="hint-text" id="hint_${q.id}">💡 İpucu: ${q.hint}</div>
      <div class="quiz-feedback" id="fb_${q.id}"></div>
      <div class="quiz-actions">
        <button class="btn-check" onclick="checkAnswer('${q.id}')">Kontrol Et</button>
        <button class="btn-hint" onclick="showHint('${q.id}')">💡 İpucu</button>
        <button class="btn-reset" onclick="resetQuiz('${q.id}')">↺ Sıfırla</button>
      </div>
    </div>`;
}

// =============================================
// INTERACTION HANDLERS
// =============================================
const selections = {}; // for tracking

function selectSingle(qid, idx) {
  document.querySelectorAll(`[id^="opt_${qid}_"]`).forEach(b => b.classList.remove('selected'));
  document.getElementById(`opt_${qid}_${idx}`).classList.add('selected');
  selections[qid] = idx;
}

function toggleMulti(qid, idx) {
  if (!selections[qid]) selections[qid] = new Set();
  const btn = document.getElementById(`opt_${qid}_${idx}`);
  if (selections[qid].has(idx)) {
    selections[qid].delete(idx);
    btn.classList.remove('selected');
  } else {
    selections[qid].add(idx);
    btn.classList.add('selected');
  }
}

function selectTF(qid, val) {
  ['true','false'].forEach(v => document.getElementById(`tf_${qid}_${v}`)?.classList.remove('selected'));
  document.getElementById(`tf_${qid}_${val}`)?.classList.add('selected');
  selections[qid] = val;
}

function selectFill(qid, word) {
  // remove previous selection
  const prev = selections[qid];
  if (prev) document.getElementById(`word_${qid}_${prev}`)?.classList.remove('used','selected');
  selections[qid] = word;
  document.querySelectorAll(`[id^="word_${qid}_"]`).forEach(b=>b.classList.remove('used'));
  document.getElementById(`word_${qid}_${word}`)?.classList.add('used');
  const slot = document.getElementById(`slot_${qid}`);
  if (slot) { slot.textContent = word; slot.style.color='var(--accent1)'; }
}

function selectWord(qid, word) {
  const chip = document.getElementById(`chip_${qid}_${word.replace(/\s/g,'_')}`);
  if (chip?.classList.contains('used')) return;
  if (!selections[qid]) selections[qid] = [];
  selections[qid].push(word);
  chip?.classList.add('used');
  const slots = document.getElementById(`slots_${qid}`);
  if (slots) {
    const el = document.createElement('button');
    el.className = 'answer-chip';
    el.textContent = word;
    el.onclick = () => removeWord(qid, word, el);
    slots.appendChild(el);
  }
}

function removeWord(qid, word, el) {
  if (!selections[qid]) return;
  const i = selections[qid].indexOf(word);
  if (i > -1) selections[qid].splice(i, 1);
  document.getElementById(`chip_${qid}_${word.replace(/\s/g,'_')}`)?.classList.remove('used');
  el.remove();
}

function showHint(qid) {
  const h = document.getElementById(`hint_${qid}`);
  if (h) h.classList.toggle('visible');
}

// =============================================
// CHECK ANSWER
// =============================================
function checkAnswer(qid) {
  const s = data.sections[currentSection];
  const q = s.quiz.find(x => x.id === qid);
  if (!q) return;

  let correct = false;
  const sel = selections[qid];

  if (q.type === 'single_choice') {
    correct = sel === q.correct;
    q.options.forEach((_,i) => {
      const btn = document.getElementById(`opt_${q.id}_${i}`);
      if (!btn) return;
      btn.disabled = true;
      if (i === q.correct) btn.classList.add('correct');
      else if (i === sel) btn.classList.add('wrong');
    });
  } else if (q.type === 'multiple_choice') {
    const selArr = sel ? [...sel] : [];
    const corrArr = q.correct;
    correct = selArr.length === corrArr.length && corrArr.every(x => selArr.includes(x));
    q.options.forEach((_,i) => {
      const btn = document.getElementById(`opt_${q.id}_${i}`);
      if (!btn) return;
      btn.disabled = true;
      if (corrArr.includes(i)) btn.classList.add('correct');
      else if (selArr.includes(i)) btn.classList.add('wrong');
    });
  } else if (q.type === 'true_false') {
    correct = sel === q.correct;
    ['true','false'].forEach(v => {
      const btn = document.getElementById(`tf_${qid}_${v}`);
      if (!btn) return;
      btn.disabled = true;
      const bVal = v === 'true';
      if (bVal === q.correct) btn.classList.add('correct');
      else if (sel !== undefined && bVal === sel) btn.classList.add('wrong');
    });
  } else if (q.type === 'ordering') {
    const items = document.querySelectorAll(`#order_${qid} .order-item`);
    const currentOrder = [...items].map(el => parseInt(el.dataset.idx));
    correct = JSON.stringify(currentOrder) === JSON.stringify(q.correctOrder);
    items.forEach((el, pos) => {
      el.style.cursor = 'default';
      if (currentOrder[pos] === q.correctOrder[pos]) el.classList.add('correct-order');
      else el.classList.add('wrong-order');
    });
  } else if (q.type === 'matching') {
    let allRight = true;
    q.pairs.forEach((p, i) => {
      const sel = document.getElementById(`match_${qid}_${i}`);
      if (!sel) return;
      sel.disabled = true;
      if (sel.value === p.right) sel.style.borderColor = 'var(--accent3)';
      else { sel.style.borderColor = 'var(--accent2)'; allRight = false; }
    });
    correct = allRight;
  } else if (q.type === 'fill_blank') {
    const word = selections[qid];
    correct = word && q.accepted.map(a=>a.toLowerCase()).includes(word.toLowerCase());
    const slot = document.getElementById(`slot_${qid}`);
    if (slot) slot.style.color = correct ? 'var(--accent3)' : 'var(--accent2)';
    document.querySelectorAll(`[id^="word_${qid}_"]`).forEach(b=>b.disabled=true);
  } else if (q.type === 'classical_order') {
    const given = (sel || []).join(' ');
    correct = given.trim().toLowerCase() === q.answer.trim().toLowerCase();
    document.querySelectorAll(`#slots_${qid} .answer-chip`).forEach(chip => {
      chip.classList.add(correct ? 'correct' : 'wrong');
    });
    document.querySelectorAll(`#bank_${qid} .word-chip`).forEach(c=>c.disabled=true);
  }

  // feedback
  const fb = document.getElementById(`fb_${qid}`);
  if (fb) {
    fb.className = 'quiz-feedback ' + (correct ? 'correct' : 'wrong');
    fb.innerHTML = correct
      ? `✓ <strong>Doğru!</strong> ${q.explanation}`
      : `✗ <strong>Yanlış.</strong> ${q.explanation}`;
  }

  // disable check btn
  const card = document.getElementById(`qcard_${qid}`);
  card?.querySelector('.btn-check')?.setAttribute('disabled','true');

  // save state
  quizState[qid] = { answered: true, correct };
  updateSectionScore(currentSection);
  checkSectionCompletion(currentSection);
}

function resetQuiz(qid) {
  delete selections[qid];
  delete quizState[qid];
  // re-render just quiz section
  renderSection(currentSection);
}

function updateSectionScore(idx) {
  const s = data.sections[idx];
  if (!s.quiz) return;
  const answered = s.quiz.filter(q => quizState[q.id]?.answered).length;
  const correct = s.quiz.filter(q => quizState[q.id]?.correct).length;
  const el = document.getElementById(`sectionScore_${idx}`);
  if (el) el.textContent = answered > 0 ? `${correct}/${answered} doğru` : '';
}

function checkSectionCompletion(idx) {
  const s = data.sections[idx];
  if (!s.quiz || s.quiz.length === 0) return;
  const allAnswered = s.quiz.every(q => quizState[q.id]?.answered);
  if (allAnswered) { completedSections.add(idx); renderNav(); }
}

function restoreQuizUI(q, state) {
  // skip for now - reset on navigate
}

// =============================================
// DRAG AND DROP (ordering)
// =============================================
function initDragDrop() {
  document.querySelectorAll('.ordering-list').forEach(list => {
    let dragEl = null;
    list.querySelectorAll('.order-item').forEach(item => {
      item.addEventListener('dragstart', e => { dragEl = item; item.classList.add('dragging'); });
      item.addEventListener('dragend', () => { dragEl?.classList.remove('dragging'); dragEl=null; });
      item.addEventListener('dragover', e => { e.preventDefault(); if (item !== dragEl) item.classList.add('over'); });
      item.addEventListener('dragleave', () => item.classList.remove('over'));
      item.addEventListener('drop', e => {
        e.preventDefault(); item.classList.remove('over');
        if (dragEl && item !== dragEl) {
          const allItems = [...list.querySelectorAll('.order-item')];
          const fromIdx = allItems.indexOf(dragEl);
          const toIdx = allItems.indexOf(item);
          if (fromIdx < toIdx) list.insertBefore(dragEl, item.nextSibling);
          else list.insertBefore(dragEl, item);
          // update order numbers
          list.querySelectorAll('.order-item .order-num').forEach((n,i)=>n.textContent=i+1);
        }
      });
    });
  });
}

// =============================================
// NAVIGATION
// =============================================
function goToSection(idx) {
  if (idx < 0 || idx >= data.sections.length) return;
  currentSection = idx;
  renderNav();
  renderSection(idx);
}

function nextSection(idx) {
  if (idx === data.sections.length - 1) {
    completedSections.add(idx);
    renderNav();
    showCompletion();
  } else {
    completedSections.add(idx);
    goToSection(idx + 1);
  }
}

function showCompletion() {
  const main = document.getElementById('mainContent');
  const total = Object.values(quizState).length;
  const correct = Object.values(quizState).filter(s=>s.correct).length;
  main.innerHTML = `
    <div style="text-align:center;padding:4rem 2rem;animation:fadeUp 0.5s ease">
      <div style="font-size:4rem;margin-bottom:1rem">🎉</div>
      <h1 style="font-size:2rem;font-weight:900;margin-bottom:0.5rem">Tebrikler!</h1>
      <p style="color:var(--text-muted);font-size:1rem;margin-bottom:2rem">Modülü başarıyla tamamladın.</p>
      <div style="display:inline-flex;gap:2rem;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.5rem 2.5rem;margin-bottom:2rem">
        <div><div style="font-size:2rem;font-weight:900;color:var(--accent3)">${correct}</div><div style="font-size:0.8rem;color:var(--text-muted);margin-top:4px">Doğru</div></div>
        <div style="border-left:1px solid var(--border)"></div>
        <div><div style="font-size:2rem;font-weight:900;color:var(--accent2)">${total-correct}</div><div style="font-size:0.8rem;color:var(--text-muted);margin-top:4px">Yanlış</div></div>
        <div style="border-left:1px solid var(--border)"></div>
        <div><div style="font-size:2rem;font-weight:900;color:var(--accent5)">${total}</div><div style="font-size:0.8rem;color:var(--text-muted);margin-top:4px">Toplam</div></div>
      </div>
      <br>
      <button class="btn-nav btn-nav-primary" onclick="goToSection(0)" style="margin:auto">↺ Baştan Başla</button>
    </div>`;
}

// =============================================
// INIT
// =============================================
renderNav();
renderSection(0);
</script>
</body>
