# Firebase App Hosting yapılandırması (Cloud Run + Cloud Build).
# Depo herkese açık olduğu için gizli sunucu anahtarları Google Cloud Secret Manager
# referansı (secret) olarak, herkese açık istemci/bölge değişkenleri ise düz değer (value) olarak tanımlanır.
runConfig:
  cpu: 1
  # @sparticuz/chromium (PDF indirme) ve sharp/resvg için en az 1024-2048 MiB gerekir.
  memoryMiB: 2048
  concurrency: 80
  minInstances: 0
  maxInstances: 4

env:
  # İstemciye gömülen (build + runtime) herkese açık değişkenler
  - variable: NEXT_PUBLIC_SUPABASE_URL
    value: https://pwzbjhgrhkcdyowknmhe.supabase.co
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_SUPABASE_KEY
    value: sb_publishable_cXSIkRvdM3hsu2ZIFjSYVQ_XRhlmng8
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_VAPID_PUBLIC_KEY
    value: BPZjDDDVbetVunbIeJZ-bBIdZpY3D8XHB7QAqFYjjDNsK-i7zypYRwQi5S-MtUN2ewC3FTmlKLluRVOLKlQETw4
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_GA_MEASUREMENT_ID
    value: G-BE10KSSWYQ
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_ADSENSE_CLIENT_ID
    value: ca-pub-8561144837504825
    availability:
      - BUILD
      - RUNTIME

  # Sunucu tarafı sırlar (build sırasında SSG/sitemap gerekebileceği için SUPABASE_SERVICE_KEY BUILD'da da açık)
  - variable: SUPABASE_SERVICE_KEY
    secret: SUPABASE_SERVICE_KEY
    availability:
      - BUILD
      - RUNTIME
  - variable: CRON_SECRET
    secret: CRON_SECRET
    availability:
      - RUNTIME
  - variable: RAG_QUEUE_WORKER_SECRET
    secret: RAG_QUEUE_WORKER_SECRET
    availability:
      - RUNTIME
  - variable: GEMINI_API_KEY
    secret: GEMINI_API_KEY
    availability:
      - RUNTIME
  - variable: GEMINI_API_KEY_CONTENT
    secret: GEMINI_API_KEY_CONTENT
    availability:
      - RUNTIME
  - variable: NEW_GEMINI_API_KEY_CONTENT
    secret: NEW_GEMINI_API_KEY_CONTENT
    availability:
      - RUNTIME
  - variable: GEMINI_API_KEY_QUESTIONS
    secret: GEMINI_API_KEY_QUESTIONS
    availability:
      - RUNTIME
  - variable: GEMINI_API_KEY_IMAGE
    secret: GEMINI_API_KEY_IMAGE
    availability:
      - RUNTIME
  - variable: GEMINI_API_KEY_YAZILI
    secret: GEMINI_API_KEY_YAZILI
    availability:
      - RUNTIME
  - variable: AZURE_SPEECH_KEY
    secret: AZURE_SPEECH_KEY
    availability:
      - RUNTIME
  - variable: AZURE_SPEECH_REGION
    value: northeurope
    availability:
      - RUNTIME
  - variable: RESEND_API_KEY
    secret: RESEND_API_KEY
    availability:
      - RUNTIME
  - variable: VAPID_PRIVATE_KEY
    secret: VAPID_PRIVATE_KEY
    availability:
      - RUNTIME
  - variable: VAPID_SUBJECT
    secret: VAPID_SUBJECT
    availability:
      - RUNTIME
